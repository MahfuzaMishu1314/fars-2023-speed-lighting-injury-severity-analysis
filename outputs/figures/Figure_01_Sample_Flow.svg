<svg xmlns="http://www.w3.org/2000/svg" width="920" height="610" viewBox="0 0 920 610" role="img" aria-labelledby="title desc"><title id="title">Sample selection and analysis populations</title><desc id="desc">Initial eligible sample, primary complete-case analysis, and separate travel-speed sensitivity subset.</desc><rect width="100%" height="100%" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#202b36}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#536273}.label{font-size:15px}.small{font-size:13px;fill:#536273}.axis{stroke:#687786;stroke-width:1}.grid{stroke:#dce3e9;stroke-width:1}.barA{fill:#477ca8}.barB{fill:#d58a48}.point{fill:#176b87;stroke:#ffffff;stroke-width:1.5}.ci{stroke:#176b87;stroke-width:3;stroke-linecap:round}</style><text x="460" y="42" text-anchor="middle" class="title">Sample selection and analysis populations</text>
<text x="460" y="67" text-anchor="middle" class="sub">2023 Fatality Analysis Reporting System (FARS)</text>
<rect x="205" y="100" width="510" height="82" rx="8" fill="#edf3f8" stroke="#477ca8" stroke-width="1.5"/>
<text x="460" y="130" text-anchor="middle" class="label" font-weight="700">Eligible driver and passenger records</text>
<text x="460" y="158" text-anchor="middle" font-size="23" font-weight="700">81,269</text>
<path d="M460 182 V220" stroke="#687786" stroke-width="2"/><path d="M452 212 L460 222 L468 212" fill="none" stroke="#687786" stroke-width="2"/>
<rect x="205" y="225" width="510" height="92" rx="8" fill="#edf3f8" stroke="#477ca8" stroke-width="1.5"/>
<text x="460" y="255" text-anchor="middle" class="label" font-weight="700">Primary complete-case analysis</text>
<text x="460" y="284" text-anchor="middle" font-size="23" font-weight="700">75,806</text>
<text x="460" y="303" text-anchor="middle" class="small">Records with complete data for the primary model</text>
<path d="M460 317 V355 H250 V385 M460 355 H670 V385" fill="none" stroke="#687786" stroke-width="1.5"/>
<path d="M242 377 L250 387 L258 377 M662 377 L670 387 L678 377" fill="none" stroke="#687786" stroke-width="1.5"/>
<rect x="70" y="390" width="360" height="94" rx="8" fill="#f6f7f8" stroke="#9aa7b3" stroke-width="1.3"/>
<text x="250" y="419" text-anchor="middle" class="label" font-weight="700">Primary interaction model</text>
<text x="250" y="448" text-anchor="middle" font-size="22" font-weight="700">n = 75,806</text>
<text x="250" y="468" text-anchor="middle" class="small">Speed-related status × lighting</text>
<rect x="490" y="390" width="360" height="94" rx="8" fill="#fff5eb" stroke="#d58a48" stroke-width="1.3"/>
<text x="670" y="419" text-anchor="middle" class="label" font-weight="700">Travel-speed sensitivity subset</text>
<text x="670" y="448" text-anchor="middle" font-size="22" font-weight="700">n = 27,873</text>
<text x="670" y="468" text-anchor="middle" class="small">Valid reported travel-speed information</text>
<text x="460" y="540" text-anchor="middle" class="small">The travel-speed subset is a separate sensitivity analysis, not a sequential sample stage.</text>
<text x="460" y="563" text-anchor="middle" class="small">All records are from crashes meeting FARS fatal-crash inclusion criteria.</text></svg>
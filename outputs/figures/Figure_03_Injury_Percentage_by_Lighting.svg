<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">Observed severe or fatal injury percentages by lighting and speed status</title><desc id="desc">Observed severe or fatal injury percentages for speed-related and non-speed-related occupants across six lighting categories.</desc><rect width="100%" height="100%" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#202b36}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#536273}.label{font-size:15px}.small{font-size:13px;fill:#536273}.axis{stroke:#687786;stroke-width:1}.grid{stroke:#dce3e9;stroke-width:1}.barA{fill:#477ca8}.barB{fill:#d58a48}.point{fill:#176b87;stroke:#ffffff;stroke-width:1.5}.ci{stroke:#176b87;stroke-width:3;stroke-linecap:round}</style><text x="500" y="38" text-anchor="middle" class="title">Observed severe/fatal injury by lighting</text><text x="500" y="62" text-anchor="middle" class="sub">Percent of occupants in each lighting and speed-status group</text><line x1="270" y1="520" x2="920" y2="520" class="grid"/><text x="255" y="525" text-anchor="end" class="small">0%</text><line x1="270" y1="440" x2="920" y2="440" class="grid"/><text x="255" y="445" text-anchor="end" class="small">20%</text><line x1="270" y1="360" x2="920" y2="360" class="grid"/><text x="255" y="365" text-anchor="end" class="small">40%</text><line x1="270" y1="280" x2="920" y2="280" class="grid"/><text x="255" y="285" text-anchor="end" class="small">60%</text><line x1="270" y1="200" x2="920" y2="200" class="grid"/><text x="255" y="205" text-anchor="end" class="small">80%</text><line x1="270" y1="120" x2="920" y2="120" class="grid"/><text x="255" y="125" text-anchor="end" class="small">100%</text><rect x="285" y="375.08000000000004" width="18" height="144.92" class="barA"/><rect x="307" y="233.36" width="18" height="286.64" class="barB"/><text x="303" y="544" text-anchor="middle" class="small">Dark- lighted</text><rect x="391" y="339.28" width="18" height="180.72" class="barA"/><rect x="413" y="217.88" width="18" height="302.12" class="barB"/><text x="409" y="544" text-anchor="middle" class="small">Dark- not lighted</text><rect x="497" y="370.6" width="18" height="149.4" class="barA"/><rect x="519" y="206.76" width="18" height="313.24" class="barB"/><text x="515" y="544" text-anchor="middle" class="small">Dark- unknown</text><rect x="603" y="318.24" width="18" height="201.76" class="barA"/><rect x="625" y="230.44" width="18" height="289.56" class="barB"/><text x="621" y="544" text-anchor="middle" class="small">Dawn</text><rect x="709" y="330" width="18" height="190" class="barA"/><rect x="731" y="219.48000000000002" width="18" height="300.52" class="barB"/><text x="727" y="544" text-anchor="middle" class="small">Daylight</text><rect x="815" y="346.72" width="18" height="173.28" class="barA"/><rect x="837" y="201.95999999999998" width="18" height="318.04" class="barB"/><text x="833" y="544" text-anchor="middle" class="small">Dusk</text><rect x="315" y="570" width="13" height="13" class="barA"/><text x="335" y="582" class="small">Not speed-related</text><rect x="490" y="570" width="13" height="13" class="barB"/><text x="510" y="582" class="small">Speed-related</text><text x="500" y="620" text-anchor="middle" class="small">Descriptive percentages; not adjusted model estimates.</text></svg>
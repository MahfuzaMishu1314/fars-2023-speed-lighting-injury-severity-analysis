<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc"><title id="title">Observed severe or fatal injury by speed-related status</title><desc id="desc">Observed severe or fatal injury percentages among eligible occupants in fatal crashes.</desc><rect width="100%" height="100%" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#202b36}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#536273}.label{font-size:15px}.small{font-size:13px;fill:#536273}.axis{stroke:#687786;stroke-width:1}.grid{stroke:#dce3e9;stroke-width:1}.barA{fill:#477ca8}.barB{fill:#d58a48}.point{fill:#176b87;stroke:#ffffff;stroke-width:1.5}.ci{stroke:#176b87;stroke-width:3;stroke-linecap:round}</style><text x="460" y="42" text-anchor="middle" class="title">Observed severe/fatal injury by speed status</text><text x="460" y="68" text-anchor="middle" class="sub">Primary descriptive sample (n = 75,806)</text><text x="315" y="125" text-anchor="middle" class="label">Not speed-related</text><rect x="230" y="202.721" width="170" height="147.279" rx="5" fill="#477ca8"/><text x="315" y="188.721" text-anchor="middle" font-size="22" font-weight="700">44.63%</text><text x="315" y="380" text-anchor="middle" class="label">n = 60,654</text><text x="605" y="125" text-anchor="middle" class="label">Speed-related</text><rect x="520" y="104.11699999999999" width="170" height="245.883" rx="5" fill="#d58a48"/><text x="605" y="90.11699999999999" text-anchor="middle" font-size="22" font-weight="700">74.51%</text><text x="605" y="380" text-anchor="middle" class="label">n = 15,152</text><line x1="130" y1="350" x2="790" y2="350" class="axis"/><text x="460" y="440" text-anchor="middle" class="small">Observed proportions within the fatal-crash sample; no causal interpretation.</text></svg>